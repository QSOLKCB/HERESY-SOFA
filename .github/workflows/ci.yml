name: Regression and evidence checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Show runtime
        run: python3 --version
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Generate local execution receipts
        run: python3 -m harness run-all
      - name: Check receipt artifacts and evidence manifests
        run: python3 -m harness verify-all
      - name: Test unpublished JSON Blueprint (HTTP contract)
        run: python3 -m unittest discover -s blueprints/JSON-FINITE-NUMBERS-v0.2.0 -p 'test_*.py' -v
      - name: Test CHAOS pilot and offline dry run (zero API spend)
        run: |
          python3 -m unittest discover -s tests -p 'test_chaos_pilot.py' -v
          python3 -m chaos_pilot dry-run > /dev/null
